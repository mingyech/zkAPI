[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = false
via_ir = true
# `read-write` on ../../.demo lets script/Deploy.s.sol write the deployment
# manifest that scripts/e2e-demo.sh reads (RUN_DIR defaults to <repo>/.demo).
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "../../.demo" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 50
